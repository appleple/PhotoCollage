    <meta charset="utf-8" />
    <title>Photo layout sample</title>
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
    />
    <link rel="stylesheet" href="./photocollage.css" />
    <script type="module">
      import PhotoCollage from "/src/index.ts";
      document.addEventListener("DOMContentLoaded", function () {
        const elements = document.getElementsByClassName("js-photocollage");
        Array.from(elements).forEach((element, index) => {
          element.classList.add("js-photoCollage-" + index);
          new PhotoCollage(".js-photoCollage-" + index, {
            srcAttribute: "data-src",
            gap: "5px",
            margin: "0px 0px 20px 0px",
            aClass: "js-smartPhoto",
            imgClass: "js-lazy-load",
            aAttribute: {
              "data-group": "group-" + index,
              "data-rel": "group-" + index,
            },
          });
        });
      });
    </script>
  </head>
